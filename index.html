<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureChat OS v2.0</title>
    
    <!-- Pustaka AI TensorFlow & BodyPix untuk Blur Background -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0/dist/body-pix.min.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box; /* Mencegah UI saling bertabrakan/mendesak batas */
        }
        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .sidebar {
            width: 320px;
            background-color: #1e293b; /* Slate 800 */
            flex-shrink: 0; /* Mencegah UI bertabrakan di layar sempit */
            display: flex;
            flex-direction: column;
            border-right: 1px solid #334155; /* Slate 700 */
        }
        .sidebar-header {
            padding: 20px;
            background-color: #0f172a;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            color: #f8fafc;
            border-bottom: 1px solid #334155;
            letter-spacing: 0.5px;
        }
        .settings-panel {
            padding: 20px;
            border-bottom: 1px solid #334155;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }
        .input-group label {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
            color: #94a3b8; /* Slate 400 */
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .input-group input {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }
        .btn-primary {
            background-color: #3b82f6; /* Blue 500 */
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #2563eb; /* Blue 600 */
        }
        .users-panel {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .users-panel h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        .copy-btn {
            background: #334155;
            border: 1px solid transparent;
            color: #cbd5e1;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .copy-btn:hover {
            background: #475569;
            color: #f8fafc;
        }
        input[type=checkbox], input[type=range] {
            accent-color: #3b82f6;
        }
        #user-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #user-list li {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            background-color: #0f172a;
            border: 1px solid #334155;
            font-weight: 500;
            color: #e2e8f0;
            transition: border-color 0.2s;
        }
        #user-list li:hover {
            border-color: #475569;
        }
        #user-list li::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #475569; /* Slate 600 */
            border-radius: 50%;
            margin-right: 10px;
            transition: all 0.2s;
        }
        #user-list li.is-talking::before {
            background-color: #10b981; /* Emerald 500 */
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
        }
        .media-status-icons {
            display: flex;
            gap: 6px;
            margin-left: 10px;
            margin-right: 10px;
        }
        .media-icon {
            color: #475569; /* Abu-abu default/mati */
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }
        .media-icon.active {
            color: #10b981; /* Hijau aktif */
        }
        .video-fullscreen-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 6px;
            padding: 6px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            opacity: 0;
            pointer-events: none; /* Mencegah bentrok klik saat tombol tersembunyi */
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .video-wrapper:hover .video-fullscreen-btn {
            opacity: 1;
            pointer-events: auto;
        }
        .video-fullscreen-btn:hover {
            background: #3b82f6;
            border-color: #3b82f6;
        }
        .video-wrapper:fullscreen {
            aspect-ratio: auto;
            border-radius: 0;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            width: 100vw;
            height: 100vh;
        }
        .video-wrapper:fullscreen video {
            object-fit: contain;
        }
        .video-wrapper:fullscreen .video-label {
            bottom: 20px;
            left: 20px;
            font-size: 16px;
        }
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0f172a;
            position: relative;
        }
        
        /* --- HANDLE RESIZE CHAT --- */
        .resizer {
            width: 4px;
            background-color: #334155;
            cursor: col-resize;
            transition: background-color 0.2s;
            z-index: 10;
        }
        .resizer:hover, .resizer.active {
            background-color: #3b82f6;
        }
        .sidebar.hidden {
            display: none !important;
        }
        .resizer.hidden {
            display: none !important;
        }
        .sidebar-toggle-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #334155;
            color: #f8fafc;
            border-radius: 6px;
            padding: 8px;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .sidebar-toggle-btn:hover {
            background: #3b82f6;
            border-color: #3b82f6;
        }
        
        /* --- GAYA UNTUK PANGGILAN VIDEO & LAYAR --- */
        .call-controls {
            display: flex;
            gap: 15px;
            padding: 15px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            justify-content: center;
            flex-wrap: wrap; /* Mencegah tombol saling bertabrakan di layar sempit */
            z-index: 5;
            margin-top: auto; /* Mengunci tombol ke bagian paling bawah */
        }
        .btn-icon {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-icon:hover { background-color: #475569; }
        .btn-icon.active { background-color: #3b82f6; color: white; }
        .btn-icon.danger { background-color: #ef4444; color: white; }
        .video-grid {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background-color: #0f172a;
            overflow-y: auto;
            justify-content: center;
            align-content: center;
            width: 100%;
            box-sizing: border-box;
        }
        .video-wrapper {
            position: relative;
            flex: 1 1 320px;
            min-width: 150px;
            max-width: 100%;
            height: auto;
            aspect-ratio: 16 / 9; /* Proporsi layar lebar mirip Discord */
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-label {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0,0,0,0.6);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            color: white;
            z-index: 2;
        }
        
        /* --- GAYA UNTUK CHAT TEKS --- */
        .chat-container {
            width: 350px;
            flex-shrink: 0; /* Mencegah UI bertabrakan di layar sempit */
            height: 100%;
            background-color: #1e293b;
            display: flex;
            flex-direction: column;
            position: relative;
            border-left: 1px solid #334155;
        }
        .chat-header {
            padding: 15px 20px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            z-index: 2;
        }
        .chat-img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 6px;
            margin-top: 8px;
            cursor: pointer;
            border: 1px solid #334155;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-msg {
            font-size: 13px;
            color: #e2e8f0;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            align-self: flex-start;
            max-width: 85%;
            word-break: break-word;
        }
        .chat-msg .author {
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 4px;
            display: block;
            font-size: 11px;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #334155;
            gap: 10px;
            align-items: center;
        }
        .chat-input {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input:focus {
            border-color: #3b82f6;
        }
        .typing-indicator {
            font-size: 11px;
            color: #94a3b8;
            padding: 0 15px 5px 15px;
            font-style: italic;
            min-height: 18px; /* Menjaga ruang agar tidak melompat */
            background-color: #1e293b;
        }
        .emoji-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.2s, transform 0.2s;
        }
        .emoji-btn:hover {
            color: #3b82f6;
            transform: scale(1.1);
        }
        .emoji-picker {
            display: none;
            position: absolute;
            bottom: 60px; /* Muncul tepat di atas area input */
            left: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            z-index: 10;
        }
        .emoji-picker.active {
            display: grid;
        }
        .emoji-item {
            cursor: pointer;
            font-size: 20px;
            text-align: center;
            padding: 5px;
            border-radius: 6px;
            transition: background-color 0.2s;
            user-select: none;
        }
        .emoji-item:hover {
            background-color: #1e293b;
        }
        
        /* --- TATA LETAK RESPONSIF UNTUK HP --- */
        @media (max-width: 768px) {
            body {
                height: auto;
                overflow-y: auto;
            }
            .app-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-top: 1px solid #334155;
                order: 3; /* Memindahkan pengaturan & list orang ke paling bawah */
            }
            .main-area {
                order: 1; /* Memastikan kamera berada di atas */
                padding: 0;
                border-bottom: 2px solid #334155;
                min-height: 35vh; 
            }
            .video-grid {
                max-height: 45vh;
            }
            .video-wrapper {
                flex: 1 1 45%; /* Di HP, video berjejer 2 kolom jika ada banyak */
            }
            .chat-container {
                width: 100%;
                border-left: none;
                order: 2; /* Chat di tengah-tengah pada HP */
                height: 50vh; /* Tinggi spesifik proporsional setengah layar */
                border-bottom: 2px solid #334155;
                width: 100% !important; /* Timpa lebar dinamis JS di layar HP */
            }
            .resizer {
                display: none !important; /* Hilangkan resizer di HP */
            }
            .users-panel {
                min-height: 300px;
            }
            .video-fullscreen-btn {
                opacity: 1; /* Pastikan tombol Fullscreen selalu terlihat di HP */
                pointer-events: auto;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                Voice Channels <span style="font-size: 10px; color: #64748b; margin-left: 5px;">v2.0</span>
            </div>
            <div class="settings-panel">
                <div class="input-group">
                    <label for="username-input">Display Name</label>
                    <input type="text" id="username-input" value="USER" maxlength="12">
                </div>
                <div class="input-group">
                    <label for="channel-input">Channel ID</label>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <input type="text" id="channel-input" value="1" maxlength="20" placeholder="Ketik ID Channel..." style="flex: 1; min-width: 120px;" autocomplete="off">
                        <div style="display: flex; gap: 8px;">
                            <button type="button" id="random-channel-btn" class="btn-primary" style="background-color: #475569; padding: 8px 10px; display: flex; align-items: center;" title="Acak ID Channel">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                            </button>
                            <button id="set-channel" class="btn-primary">JOIN</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Panel Daftar Pengguna -->
            <div class="users-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0;"><span id="active-channel-label">Active in Channel </span><span id="ch-display">1</span></h3>
                    <button id="copy-channel-btn" class="copy-btn" title="Salin ID Channel">
                        <svg id="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span id="copy-text">Salin</span>
                    </button>
                </div>
                <ul id="user-list">
                    <!-- Daftar orang akan muncul di sini via JavaScript -->
                </ul>
            </div>
        </div>
        
        <!-- Handle Garis untuk mengubah ukuran sidebar -->
        <div class="resizer" id="sidebar-resizer"></div>
        
        <div class="main-area">
            <!-- Toggle Sidebar Button -->
            <button id="sidebar-toggle" class="sidebar-toggle-btn" title="Sembunyikan/Tampilkan Panel Voice Channels">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>

            <!-- Papan Tampilan Kamera & Layar -->
            <div id="video-grid" class="video-grid">
                <div id="empty-state" style="margin: auto; color: #64748b; font-size: 14px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15.6 11.6L22 7v10l-6.4-4.5v-1zM4 5h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7c0-1.1.9-2 2-2z"/></svg>
                    <span>Ruang Panggilan Kosong<br>Nyalakan kamera atau bagikan layar untuk memulai.</span>
                </div>
                <div class="video-wrapper" id="wrapper-local" style="display: none;">
                    <video id="local-video" autoplay playsinline muted style="transform: scaleX(-1);"></video>
                    <div class="video-label">Anda</div>
                    <button class="video-fullscreen-btn" title="Layar Penuh" onclick="toggleFullscreen(this.parentElement)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                    </button>
                </div>
            </div>

            <!-- Kendali Panggilan Video / Audio di Bawah Layar -->
            <div class="call-controls" id="call-controls">
                <button id="btn-mic" class="btn-icon danger" title="Nyalakan Mikrofon">
                    <svg id="icon-mic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </button>
                <button id="btn-speaker" class="btn-icon active" title="Matikan/Nyalakan Suara Output (Deafen)">
                    <svg id="icon-speaker" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                </button>
                <button id="btn-cam" class="btn-icon danger" title="Nyalakan Kamera">
                    <svg id="icon-cam" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </button>
                <button id="btn-blur" class="btn-icon" title="Blur Background (Latar Buram)" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 0 0 20V2z"></path></svg>
                </button>
                <button id="btn-screen" class="btn-icon" title="Bagikan Layar (Share Screen)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                </button>
                <button id="btn-disconnect" class="btn-icon danger" title="Putuskan Panggilan (Keluar)" style="margin-left: 15px; background-color: #ef4444;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg>
                </button>
            </div>
        </div>

        <!-- Handle Garis untuk mengubah ukuran chat -->
        <div class="resizer" id="chat-resizer"></div>

        <!-- Container Chat Teks -->
        <div class="chat-container">
            <div class="chat-header">
                <h3 style="margin: 0; display: flex; align-items: center; gap: 10px; color: #f8fafc;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span id="chat-channel-label">Channel </span><span id="chat-header-ch">1</span>
                </h3>
                <button id="download-log-btn" class="btn-primary" style="padding: 6px 12px; font-size: 12px; display: flex; align-items: center; gap: 5px;" title="Simpan Log Percakapan ke Teks">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Simpan Log
                </button>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <div id="typing-indicator" class="typing-indicator"></div>
            <div id="emoji-picker" class="emoji-picker">
                <span class="emoji-item">😀</span>
                <span class="emoji-item">😂</span>
                <span class="emoji-item">😎</span>
                <span class="emoji-item">😍</span>
                <span class="emoji-item">🥳</span>
                <span class="emoji-item">😭</span>
                <span class="emoji-item">😤</span>
                <span class="emoji-item">😡</span>
                <span class="emoji-item">👍</span>
                <span class="emoji-item">🙏</span>
                <span class="emoji-item">🔥</span>
                <span class="emoji-item">✨</span>
                <span class="emoji-item">💯</span>
                <span class="emoji-item">❤️</span>
                <span class="emoji-item">👀</span>
                <span class="emoji-item">💀</span>
                <span class="emoji-item">🤡</span>
                <span class="emoji-item">👋</span>
            </div>
            <form id="chat-form" class="chat-input-area">
                <button type="button" id="upload-btn" class="emoji-btn" title="Unggah Gambar">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>
                <input type="file" id="image-upload" accept="image/*" style="display: none;">
                <button type="button" id="emoji-btn" class="emoji-btn" title="Pilih Emoji">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
                </button>
                <input type="text" id="chat-input" class="chat-input" placeholder="Ketik pesan..." autocomplete="off" required>
                <button type="submit" class="btn-primary" style="padding: 8px 15px;">Kirim</button>
            </form>
        </div>
    </div>

    <!-- Gunakan CDN untuk memuat Socket.io agar bisa berjalan di Vercel -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
        const channelInput = document.getElementById('channel-input');
        const setChannelBtn = document.getElementById('set-channel');
        const randomChannelBtn = document.getElementById('random-channel-btn');
        const usernameInput = document.getElementById('username-input');
        const copyChannelBtn = document.getElementById('copy-channel-btn');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');
        const emojiBtn = document.getElementById('emoji-btn');
        const emojiPicker = document.getElementById('emoji-picker');
        const emojis = document.querySelectorAll('.emoji-item');
        const uploadBtn = document.getElementById('upload-btn');
        const imageUpload = document.getElementById('image-upload');
        const downloadLogBtn = document.getElementById('download-log-btn');
        const chatHeaderCh = document.getElementById('chat-header-ch');
        const activeChannelLabel = document.getElementById('active-channel-label');
        const chatChannelLabel = document.getElementById('chat-channel-label');
        const typingIndicator = document.getElementById('typing-indicator');
        
        // Variabel untuk WebRTC
        const btnMic = document.getElementById('btn-mic');
        const btnSpeaker = document.getElementById('btn-speaker');
        const btnCam = document.getElementById('btn-cam');
        const btnBlur = document.getElementById('btn-blur');
        const btnScreen = document.getElementById('btn-screen');
        const btnDisconnect = document.getElementById('btn-disconnect');
        const callControls = document.getElementById('call-controls');
        const localVideo = document.getElementById('local-video');
        const wrapperLocal = document.getElementById('wrapper-local');
        const videoGrid = document.getElementById('video-grid');

        if (typeof io === 'undefined') {
            alert("ERR: SERVER MATI. Pastikan Anda mengakses via http://localhost:3000 dan BUKAN mengklik ganda file HTML.");
        } else {
            // Masukkan URL Live Site dari Glitch / Koyeb / Render Anda di sini
            // Contoh: 'https://backend-radio-saya.glitch.me'
            const BACKEND_URL = ''; 
            const socket = io(BACKEND_URL);
            
            let currentChannel = '1';
            const chDisplay = document.getElementById('ch-display');
            const userListEl = document.getElementById('user-list');
            const mutedUsers = new Set(); // Menyimpan daftar user yang dibisukan
            const remoteUsers = {}; // Menyimpan Nama dari ID Socket
            let typingTimeout;
            let typingUsers = new Set(); // Melacak siapa saja yang sedang mengetik
            
            const peers = {}; // Daftar koneksi WebRTC dengan teman
            let localStream = null;
            let rawVideoStream = null;
            let screenStream = null;
            let isVideoEnabled = false, isAudioEnabled = false, isScreenSharing = false, isSpeakerEnabled = true;
            
            // Variabel untuk AI Background Blur
            let bodyPixNet = null, isBlurEnabled = false, blurAnimationFrame = null;
            const processingCanvas = document.createElement('canvas');
            const rawVideo = document.createElement('video');
            rawVideo.autoplay = true; rawVideo.playsinline = true;
            
            // Trik melewati pemblokiran Autoplay Audio/Video di HP (iOS/Android)
            document.body.addEventListener('click', () => {
                document.querySelectorAll('video').forEach(v => {
                    if (v.paused && v.id !== 'local-video') {
                        v.play().catch(e => console.warn("Autoplay tertahan:", e));
                    }
                });
            });

            // ==========================================
            // LOGIKA RESIZE & TOGGLE (FLEXIBLE UI)
            // ==========================================
            const chatResizer = document.getElementById('chat-resizer');
            const chatContainer = document.querySelector('.chat-container');
            let isResizingChat = false;

            chatResizer.addEventListener('mousedown', () => {
                isResizingChat = true;
                document.body.style.cursor = 'col-resize';
                chatResizer.classList.add('active');
            });

            const sidebarResizer = document.getElementById('sidebar-resizer');
            const sidebar = document.getElementById('sidebar');
            let isResizingSidebar = false;

            sidebarResizer.addEventListener('mousedown', () => {
                isResizingSidebar = true;
                document.body.style.cursor = 'col-resize';
                sidebarResizer.classList.add('active');
            });

            document.addEventListener('mousemove', (e) => {
                if (isResizingChat) {
                    let newWidth = window.innerWidth - e.clientX;
                    if (newWidth < 250) newWidth = 250;
                    if (newWidth > window.innerWidth * 0.6) newWidth = window.innerWidth * 0.6;
                    chatContainer.style.width = newWidth + 'px';
                }
                if (isResizingSidebar) {
                    let newWidth = e.clientX;
                    if (newWidth < 250) newWidth = 250;
                    if (newWidth > window.innerWidth * 0.5) newWidth = window.innerWidth * 0.5;
                    sidebar.style.width = newWidth + 'px';
                }
            });

            document.addEventListener('mouseup', () => {
                if (isResizingChat) {
                    isResizingChat = false;
                    document.body.style.cursor = 'default';
                    chatResizer.classList.remove('active');
                }
                if (isResizingSidebar) {
                    isResizingSidebar = false;
                    document.body.style.cursor = 'default';
                    sidebarResizer.classList.remove('active');
                }
            });

            // Toggle Sidebar Menu Kiri
            const sidebarToggleBtn = document.getElementById('sidebar-toggle');
            sidebarToggleBtn.addEventListener('click', () => {
                sidebar.classList.toggle('hidden');
                sidebarResizer.classList.toggle('hidden');
            });

            // Bergabung ke channel default (1) saat pertama kali dimuat
            const initialName = usernameInput.value.trim().toUpperCase() || 'USER';
            socket.emit('joinChannel', { channel: currentChannel, username: initialName });

            // Kirim pembaruan ke server secara otomatis saat pengguna mengetik ID baru
            usernameInput.addEventListener('change', () => {
                const newName = usernameInput.value.trim().toUpperCase() || 'USER';
                socket.emit('updateUsername', newName);
            });

            // Menerima nama final dari server (jika nama sebelumnya dipakai orang lain)
            socket.on('usernameAssigned', (assignedName) => {
                usernameInput.value = assignedName;
            });

            // Fungsi untuk membuat channel ID acak (Huruf, Angka, Simbol)
            randomChannelBtn.addEventListener('click', () => {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
                let randomId = '';
                for (let i = 0; i < 8; i++) {
                    randomId += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                channelInput.value = randomId;
            });

            // Fungsi untuk mengganti kode channel (tuning frekuensi)
            setChannelBtn.addEventListener('click', () => {
                const newChannel = channelInput.value;
                if (newChannel && newChannel !== currentChannel) {
                    currentChannel = newChannel;
                    activeChannelLabel.innerText = 'Active in Channel ';
                    chDisplay.innerText = currentChannel; // Perbarui teks di atas panel pengguna
                    callControls.style.setProperty('display', 'flex', 'important'); // Tampilkan tombol navigasi
                    chatChannelLabel.innerText = 'Channel ';
                    chatHeaderCh.innerText = currentChannel;
                    
                    clearPeers(); // Putuskan panggilan video/suara dengan channel lama
                    const currentName = usernameInput.value.trim().toUpperCase() || 'USER';
                    socket.emit('joinChannel', { channel: currentChannel, username: currentName });
                    chatMessages.innerHTML = ''; // Kosongkan chat saat pindah channel
                    typingUsers.clear(); updateTypingIndicator();
                }
            });

            // Fungsi menyalin ID Channel ke Papan Klip (Clipboard)
            copyChannelBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(currentChannel).then(() => {
                    const iconEl = document.getElementById('copy-icon');
                    const textEl = document.getElementById('copy-text');
                    iconEl.innerHTML = `<polyline points="20 6 9 17 4 12"></polyline>`;
                    textEl.innerText = 'Disalin';
                    copyChannelBtn.style.color = '#10b981';
                    setTimeout(() => {
                        iconEl.innerHTML = `<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>`;
                        textEl.innerText = 'Salin';
                        copyChannelBtn.style.color = '#cbd5e1';
                    }, 2000);
                });
            });

            // Menyimpan log chat ke file teks
            downloadLogBtn.addEventListener('click', () => {
                let logText = `=== SECURE CHAT LOG - CHANNEL ${currentChannel} ===\n`;
                logText += `Diunduh pada: ${new Date().toLocaleString('id-ID')}\n\n`;
                
                const messages = chatMessages.querySelectorAll('.chat-msg');
                messages.forEach(msg => {
                    const authorText = msg.querySelector('.author').innerText.replace('\n', ' ');
                    const contentEl = msg.querySelector('.msg-content');
                    let contentText = '';
                    if (contentEl.tagName === 'IMG') {
                        contentText = '[Gambar Terlampir]';
                    } else {
                        contentText = contentEl.innerText;
                    }
                    logText += `${authorText}: ${contentText}\n`;
                });
                
                const blob = new Blob([logText], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `SecureChat_Log_CH${currentChannel}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            });

            // Efek suara notifikasi pesan teks (Ting)
            function playNotificationSound() {
                if (!isSpeakerEnabled) return; // Jangan bunyikan jika speaker sedang dimatikan
                if (!window.AudioContext && !window.webkitAudioContext) return;
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                const now = audioCtx.currentTime;

                osc.type = 'sine'; // Suara lonceng/ting yang bersih
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.5); // Efek memudar perlahan
                osc.frequency.setValueAtTime(1200, now); // Frekuensi tinggi (Ting!)

                osc.start(now);
                osc.stop(now + 0.5);
            }

            function toggleTalkingStatus(username, isActive) {
                const items = userListEl.querySelectorAll('li');
                items.forEach(li => {
                    if (li.dataset.username === username) {
                        if (isActive) li.classList.add('is-talking');
                        else li.classList.remove('is-talking');
                    }
                });
            }

            // Menerima pembaruan daftar pengguna dari server
            socket.on('userListUpdate', (users) => {
                if (!currentChannel) return; // Cegah data masuk saat sudah disconnect
                userListEl.innerHTML = ''; // Kosongkan daftar lama
                const localName = usernameInput.value.trim().toUpperCase() || 'USER';

                users.forEach(userObj => {
                    const user = userObj.username;
                    remoteUsers[userObj.id] = user;
                    
                    const labelEl = document.getElementById(`label-${userObj.id}`);
                    if (labelEl) labelEl.innerText = user;
                    
                    const li = document.createElement('li');
                    li.dataset.username = user; // Simpan nama untuk pencarian
                    
                    // Div pembungkus agar nama dan lokasi tertumpuk rapi di sebelah kiri
                    const infoDiv = document.createElement('div');
                    infoDiv.style.flex = '1';
                    infoDiv.style.display = 'flex';
                    infoDiv.style.flexDirection = 'column';
                    infoDiv.style.minWidth = '0';

                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = user;
                    
                    if (user === localName) {
                        nameSpan.textContent += ' (Anda)';
                        nameSpan.style.color = '#3b82f6'; // Warna biru khusus untuk diri sendiri
                        nameSpan.style.fontWeight = 'bold';
                        infoDiv.appendChild(nameSpan);
                    } else {
                        infoDiv.appendChild(nameSpan);
                    }
                    
                    li.appendChild(infoDiv);
                    
                    // Indikator Media (Mic & Cam)
                    const mediaDiv = document.createElement('div');
                    mediaDiv.className = 'media-status-icons';
                    mediaDiv.id = `media-icons-${userObj.id}`;
                    const micActive = userObj.media && userObj.media.audio;
                    const camActive = userObj.media && userObj.media.video;
                    mediaDiv.innerHTML = `
                        <span class="media-icon mic-icon ${micActive ? 'active' : ''}" title="Mikrofon">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                        </span>
                        <span class="media-icon cam-icon ${camActive ? 'active' : ''}" title="Kamera">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                        </span>
                    `;
                    li.appendChild(mediaDiv);

                    if (user !== localName) {
                        const svgUnmuted = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
                        const svgMuted = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="1" x2="1" y2="23"></line></svg>`;
                        
                        // Tombol Mute individual per user
                        const muteBtn = document.createElement('button');
                        muteBtn.innerHTML = mutedUsers.has(user) ? svgMuted : svgUnmuted;
                        muteBtn.style.background = 'none';
                        muteBtn.style.border = 'none';
                        muteBtn.style.cursor = 'pointer';
                        muteBtn.style.color = mutedUsers.has(user) ? '#ef4444' : '#64748b';
                        muteBtn.style.display = 'flex';
                        muteBtn.style.alignItems = 'center';
                        
                        muteBtn.addEventListener('click', () => {
                            if (mutedUsers.has(user)) {
                                mutedUsers.delete(user);
                                muteBtn.innerHTML = svgUnmuted;
                                muteBtn.style.color = '#64748b';
                            } else {
                                mutedUsers.add(user);
                                muteBtn.innerHTML = svgMuted;
                                muteBtn.style.color = '#ef4444';
                            }
                        });
                        
                        li.appendChild(muteBtn);
                    }
                    
                    userListEl.appendChild(li);
                });
            });

            // Menampilkan/Menyembunyikan Panel Emoji
            emojiBtn.addEventListener('click', (e) => {
                emojiPicker.classList.toggle('active');
            });

            // Memasukkan emoji yang diklik ke dalam input chat
            emojis.forEach(emoji => {
                emoji.addEventListener('click', () => {
                    chatInput.value += emoji.innerText;
                    chatInput.focus();
                });
            });

            // Menyembunyikan panel emoji jika mengklik di luar area panel
            document.addEventListener('click', (e) => {
                if (!emojiBtn.contains(e.target) && !emojiPicker.contains(e.target)) {
                    emojiPicker.classList.remove('active');
                }
            });

            // Logika Indikator Sedang Mengetik (Typing)
            function updateTypingIndicator() {
                if (typingUsers.size === 0) {
                    typingIndicator.innerText = '';
                } else if (typingUsers.size === 1) {
                    typingIndicator.innerText = `${Array.from(typingUsers)[0]} sedang mengetik...`;
                } else {
                    typingIndicator.innerText = `${typingUsers.size} orang sedang mengetik...`;
                }
            }

            chatInput.addEventListener('input', () => {
                if (!currentChannel) return;
                socket.emit('typing', true);
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => socket.emit('typing', false), 2000);
            });

            socket.on('typing', (data) => {
                if (!currentChannel) return; // Cegah indikator masuk jika sudah offline
                if (mutedUsers.has(data.username)) return; // Jangan tampilkan indikator jika user di-mute
                if (data.isTyping) {
                    typingUsers.add(data.username);
                } else {
                    typingUsers.delete(data.username);
                }
                updateTypingIndicator();
            });

            // Logika upload gambar
            uploadBtn.addEventListener('click', () => {
                imageUpload.click();
            });

            imageUpload.addEventListener('change', (e) => {
                if (!currentChannel) {
                    alert("Anda sudah keluar. Silakan bergabung (JOIN) ke channel terlebih dahulu!");
                    return;
                }
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 2 * 1024 * 1024) { // Limit gambar 2MB
                        alert("Ukuran gambar terlalu besar! Maksimal 2MB.");
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        socket.emit('imageMessage', event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
                e.target.value = ''; // Reset form
            });

            // Mengirim pesan teks
            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (!currentChannel) {
                    alert("Anda sudah keluar. Silakan bergabung (JOIN) ke channel terlebih dahulu!");
                    return;
                }
                const text = chatInput.value.trim();
                if (text) {
                    socket.emit('textMessage', text);
                    chatInput.value = '';
                    socket.emit('typing', false); // Hapus indikator mengetik setelah pesan terkirim
                    clearTimeout(typingTimeout);
                }
            });

            // Fungsi Sentral Merender Pesan Chat (Teks dan Gambar)
            function renderMessage(data, type) {
                if (!currentChannel) return; // Cegah pesan masuk jika sudah offline
                if (mutedUsers.has(data.username)) return; // Sembunyikan pesan teks dari user yang di-mute

                const msgDiv = document.createElement('div');
                msgDiv.className = 'chat-msg';
                msgDiv.id = `msg-${data.id}`; // Pasang ID unik ke elemen HTML
                
                const localName = usernameInput.value.trim().toUpperCase() || 'USER';
                const isMine = data.username === localName;
                
                if (isMine) {
                    msgDiv.style.alignSelf = 'flex-end';
                    msgDiv.style.backgroundColor = '#1e293b';
                    msgDiv.style.borderColor = '#3b82f6';
                } else {
                    playNotificationSound();
                    toggleTalkingStatus(data.username, true);
                    setTimeout(() => toggleTalkingStatus(data.username, false), 1500); // Efek kedip hijau singkat
                }
                
                // Mendapatkan jam saat ini (Contoh: 14:05)
                const timeString = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                
                // Membuat pembungkus fleksibel agar nama, waktu, dan tombol hapus sejajar
                const headerDiv = document.createElement('div');
                headerDiv.style.display = 'flex';
                headerDiv.style.justifyContent = 'space-between';
                headerDiv.style.alignItems = 'center';
                headerDiv.style.marginBottom = '6px';
                
                const authorSpan = document.createElement('span');
                authorSpan.className = 'author';
                authorSpan.style.marginBottom = '0'; // Menimpa margin bawaan CSS
                // Menggabungkan nama dan waktu dengan gaya yang rapi
                authorSpan.innerHTML = `${isMine ? 'Anda' : data.username} <span style="font-size: 9px; color: #64748b; font-weight: normal; margin-left: 6px;">${timeString}</span>`;
                
                headerDiv.appendChild(authorSpan);
                
                // Tambahkan ikon tombol hapus jika pesan ini adalah milik kita
                if (isMine) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`;
                    deleteBtn.style.background = 'none';
                    deleteBtn.style.border = 'none';
                    deleteBtn.style.color = '#ef4444';
                    deleteBtn.style.cursor = 'pointer';
                    deleteBtn.style.padding = '0';
                    deleteBtn.style.marginLeft = '15px';
                    deleteBtn.style.opacity = '0.7';
                    deleteBtn.title = 'Hapus Pesan';
                    deleteBtn.onmouseover = () => deleteBtn.style.opacity = '1';
                    deleteBtn.onmouseout = () => deleteBtn.style.opacity = '0.7';
                    
                    deleteBtn.onclick = () => socket.emit('deleteMessage', data.id);
                    headerDiv.appendChild(deleteBtn);
                }
                
                const textSpan = document.createElement('span');
                textSpan.textContent = data.text; // Aman dari injeksi XSS karena memakai textContent
                
                msgDiv.appendChild(headerDiv);

                if (type === 'image') {
                    const imgEl = document.createElement('img');
                    imgEl.src = data.image;
                    imgEl.className = 'chat-img msg-content';
                    msgDiv.appendChild(imgEl);
                } else {
                    const textSpan = document.createElement('span');
                    textSpan.className = 'msg-content';
                    textSpan.textContent = data.text; 
                    msgDiv.appendChild(textSpan);
                }

                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll ke bawah saat pesan baru masuk
            }

            // Mendengarkan riwayat obrolan dari MongoDB saat baru masuk channel
            socket.on('chatHistory', (messages) => {
                messages.forEach(msg => {
                    if (msg.type === 'image') {
                        renderMessage({ id: msg.messageId, username: msg.username, image: msg.image }, 'image');
                    } else {
                        renderMessage({ id: msg.messageId, username: msg.username, text: msg.text }, 'text');
                    }
                });
            });

            socket.on('textMessage', (data) => renderMessage(data, 'text'));
            socket.on('imageMessage', (data) => renderMessage(data, 'image'));

            // Mendengarkan instruksi penghapusan pesan dari server
            socket.on('messageDeleted', (msgId) => {
                if (!currentChannel) return;
                const msgEl = document.getElementById(`msg-${msgId}`);
                if (msgEl) {
                    // Efek animasi menyusut dan memudar sebelum elemennya dihapus total
                    msgEl.style.transition = 'opacity 0.2s, transform 0.2s';
                    msgEl.style.opacity = '0';
                    msgEl.style.transform = 'scale(0.9)';
                    setTimeout(() => msgEl.remove(), 200);
                }
            });
            
            // ==========================================
            // LOGIKA WEBRTC (VIDEO, SUARA, SHARE SCREEN)
            // ==========================================
            
            function updateVideoGridVisibility() {
                const hasRemote = document.querySelectorAll('.video-wrapper:not(#wrapper-local)').length > 0;
                const emptyState = document.getElementById('empty-state');
                if (hasRemote || isVideoEnabled || isScreenSharing) {
                    if (emptyState) emptyState.style.display = 'none';
                } else {
                    if (emptyState) {
                        emptyState.style.display = 'flex';
                        if (!currentChannel) {
                            emptyState.innerHTML = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg><span>Anda sedang Offline<br>Silakan bergabung (JOIN) ke sebuah Channel.</span>';
                        } else {
                            emptyState.innerHTML = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15.6 11.6L22 7v10l-6.4-4.5v-1zM4 5h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7c0-1.1.9-2 2-2z"/></svg><span>Ruang Panggilan Kosong<br>Nyalakan kamera atau bagikan layar untuk memulai.</span>';
                        }
                    }
                }
            }

            function clearPeers() {
                Object.values(peers).forEach(pc => pc.close());
                for (const key in peers) delete peers[key];
                document.querySelectorAll('.video-wrapper:not(#wrapper-local)').forEach(w => w.remove());
                updateVideoGridVisibility();
            }

            // Fungsi Buka Layar Penuh (Fullscreen API)
            window.toggleFullscreen = function(element) {
                const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                if (!isFullscreen) {
                    if (element.requestFullscreen) element.requestFullscreen();
                    else if (element.webkitRequestFullscreen) element.webkitRequestFullscreen();
                    else if (element.msRequestFullscreen) element.msRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                    else if (document.msExitFullscreen) document.msExitFullscreen();
                }
            };
            
            // Menyiarkan Status Media Lokal ke Server
            function emitMediaState() {
                socket.emit('mediaStateChange', { audio: isAudioEnabled, video: isVideoEnabled || isScreenSharing });
            }

            // Menerima Update Status Media Pengguna Lain
            socket.on('userMediaUpdate', (data) => {
                if (!currentChannel) return; 
                const micIcon = document.querySelector(`#media-icons-${data.id} .mic-icon`);
                const camIcon = document.querySelector(`#media-icons-${data.id} .cam-icon`);
                if (micIcon) {
                    if (data.media.audio) micIcon.classList.add('active');
                    else micIcon.classList.remove('active');
                }
                if (camIcon) {
                    if (data.media.video) camIcon.classList.add('active');
                    else camIcon.classList.remove('active');
                }
            });

            async function getMediaStream() {
                if (!localStream) {
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                        localStream.getAudioTracks()[0].enabled = isAudioEnabled;
                        localStream.getVideoTracks()[0].enabled = isVideoEnabled;
                        localVideo.srcObject = localStream;
                        
                        Object.values(peers).forEach(pc => {
                            localStream.getTracks().forEach(track => {
                                const sender = pc.getSenders().find(s => s.track && s.track.kind === track.kind);
                                if (!sender) pc.addTrack(track, localStream);
                            });
                        });
                    } catch (err) {
                        console.error("Gagal mengakses media:", err);
                        alert("Kamera/Mikrofon gagal diakses. Pastikan perizinan diberikan.");
                    }
                }
            }

            btnMic.addEventListener('click', async () => {
                await getMediaStream();
                if (localStream) {
                    isAudioEnabled = !isAudioEnabled;
                    localStream.getAudioTracks()[0].enabled = isAudioEnabled;
                    if (isAudioEnabled) {
                        btnMic.classList.add('active'); btnMic.classList.remove('danger');
                        document.getElementById('icon-mic').innerHTML = '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line>';
                    } else {
                        btnMic.classList.remove('active'); btnMic.classList.add('danger');
                        document.getElementById('icon-mic').innerHTML = '<line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line>';
                    }
                }
                emitMediaState();
            });

            btnCam.addEventListener('click', async () => {
                await getMediaStream();
                if (localStream) {
                    isVideoEnabled = !isVideoEnabled;
                    localStream.getVideoTracks()[0].enabled = isVideoEnabled;
                    wrapperLocal.style.display = isVideoEnabled || isScreenSharing ? 'block' : 'none';
                    updateVideoGridVisibility();
                    
                    if (isVideoEnabled) {
                        btnCam.classList.add('active'); btnCam.classList.remove('danger');
                        document.getElementById('icon-cam').innerHTML = '<path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>';
                    } else {
                        btnCam.classList.remove('active'); btnCam.classList.add('danger');
                        document.getElementById('icon-cam').innerHTML = '<path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
                    }
                }
                emitMediaState();
            });

            btnScreen.addEventListener('click', async () => {
                if (!currentChannel) return alert("Silakan bergabung (JOIN) ke channel terlebih dahulu!");
                if (!navigator.mediaDevices) return alert("Browser Anda memblokir fitur ini. Pastikan Anda menggunakan HTTPS atau Localhost!");
                if (!isScreenSharing) {
                    try {
                        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true }).catch(err => { throw new Error('Share Screen Dibatalkan'); });
                        const screenTrack = screenStream.getVideoTracks()[0];
                        
                        isScreenSharing = true;
                        btnScreen.classList.add('active');
                        wrapperLocal.style.display = 'block';
                        localVideo.style.transform = 'none'; // Jangan dibalik saat share screen
                        updateVideoGridVisibility();

                        if (localStream) {
                            Object.values(peers).forEach(pc => {
                                const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                                if (sender) sender.replaceTrack(screenTrack);
                            });
                            localVideo.srcObject = new MediaStream([screenTrack]);
                        }
                        
                        screenTrack.onended = () => stopScreenShare();
                    } catch (err) {
                        console.error("Gagal membagikan layar", err);
                    }
                } else {
                    stopScreenShare();
                }
                emitMediaState();
            });

            // === LOGIKA MATIKAN/KELUAR TOTAL (DISCONNECT) ===
            btnDisconnect.addEventListener('click', () => {
                if (!currentChannel) return; // Cek jika sudah keluar
                
                // Hentikan semua media lokal secara paksa
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                if (rawVideoStream) {
                    rawVideoStream.getTracks().forEach(t => t.stop());
                    rawVideoStream = null;
                }
                if (screenStream) {
                    screenStream.getTracks().forEach(t => t.stop());
                    screenStream = null;
                }
                if (blurAnimationFrame) cancelAnimationFrame(blurAnimationFrame);
                
                isAudioEnabled = false; isVideoEnabled = false; isScreenSharing = false; isBlurEnabled = false;
                
                // Reset UI Tombol
                btnMic.classList.remove('active'); btnMic.classList.add('danger');
                document.getElementById('icon-mic').innerHTML = '<line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line>';
                btnCam.classList.remove('active'); btnCam.classList.add('danger');
                document.getElementById('icon-cam').innerHTML = '<path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
                btnScreen.classList.remove('active');
                btnBlur.classList.remove('active'); btnBlur.style.display = 'none';
                wrapperLocal.style.display = 'none'; localVideo.srcObject = null;
                
                clearPeers();
                emitMediaState();
                socket.emit('leaveChannel');
                
                currentChannel = null;
                activeChannelLabel.innerText = 'Offline';
                chDisplay.innerText = '';
                chatChannelLabel.innerText = 'Offline';
                chatHeaderCh.innerText = '';
                userListEl.innerHTML = '';
                callControls.style.setProperty('display', 'none', 'important'); // Sembunyikan tombol navigasi
                chatMessages.innerHTML = '<div style="text-align:center; color:#64748b; margin-top:20px; font-size:12px;">Anda telah terputus dari panggilan.</div>';
                typingUsers.clear(); updateTypingIndicator();
                updateVideoGridVisibility(); // Segarkan tampilan agar pesan "Anda sedang Offline" muncul
            });

            function stopScreenShare() {
                isScreenSharing = false;
                btnScreen.classList.remove('active');
                localVideo.style.transform = 'scaleX(-1)';
                if (localStream) {
                    const videoTrack = localStream.getVideoTracks()[0];
                    Object.values(peers).forEach(pc => {
                        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) sender.replaceTrack(videoTrack);
                    });
                    localVideo.srcObject = localStream;
                    wrapperLocal.style.display = isVideoEnabled ? 'block' : 'none';
                } else {
                    wrapperLocal.style.display = 'none';
                }
                updateVideoGridVisibility();
                emitMediaState();
            }

            function createPeerConnection(targetId, isInitiator) {
                const pc = new RTCPeerConnection({ 
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ] 
                });
                pc.iceQueue = []; // Antrean untuk mencegah ICE candidates hilang
                peers[targetId] = pc;

                // Inisiator membuat slot Transceiver untuk komunikasi dua arah
                if (isInitiator) {
                    const audioTransceiver = pc.addTransceiver('audio', { direction: 'sendrecv' });
                    const videoTransceiver = pc.addTransceiver('video', { direction: 'sendrecv' });
                    
                    if (localStream) {
                        const audioTrack = localStream.getAudioTracks()[0];
                        if (audioTrack) audioTransceiver.sender.replaceTrack(audioTrack);
                        const videoTrack = localStream.getVideoTracks()[0];
                        if (videoTrack) videoTransceiver.sender.replaceTrack(videoTrack);
                    }
                }

                pc.onicecandidate = (event) => {
                    if (event.candidate) socket.emit('webrtcSignal', { target: targetId, signal: { type: 'candidate', candidate: event.candidate } });
                };

                pc.ontrack = (event) => {
                    let wrapper = document.getElementById(`wrapper-${targetId}`);
                    if (!wrapper) {
                        wrapper = document.createElement('div');
                        wrapper.className = 'video-wrapper';
                        wrapper.id = `wrapper-${targetId}`;
                        
                        const videoEl = document.createElement('video');
                        videoEl.id = `video-${targetId}`;
                        videoEl.autoplay = true; 
                        videoEl.playsInline = true; // Wajib menggunakan 'I' kapital di JS
                        videoEl.setAttribute('playsinline', ''); // Aturan ekstra ketat untuk iPhone/iOS Safari
                        videoEl.muted = !isSpeakerEnabled; // Terapkan status speaker saat ini
                        
                        const label = document.createElement('div');
                        label.className = 'video-label';
                        label.id = `label-${targetId}`;
                        label.innerText = remoteUsers[targetId] || 'User';
                        
                        const fsBtn = document.createElement('button');
                        fsBtn.className = 'video-fullscreen-btn';
                        fsBtn.title = 'Layar Penuh';
                        fsBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>';
                        fsBtn.onclick = () => window.toggleFullscreen(wrapper);

                        wrapper.appendChild(videoEl); wrapper.appendChild(label); wrapper.appendChild(fsBtn);
                        videoGrid.appendChild(wrapper);
                        updateVideoGridVisibility();
                    }
                    const videoEl = document.getElementById(`video-${targetId}`);
                    
                    let stream = videoEl.srcObject;
                    if (!stream) stream = new MediaStream();
                    
                    if (!stream.getTracks().find(t => t.kind === event.track.kind)) {
                        stream.addTrack(event.track);
                    }
                    
                    // Paksa browser me-render ulang tampilannya agar video muncul!
                    videoEl.srcObject = stream;
                    videoEl.play().catch(e => {}); 
                };

                pc.onnegotiationneeded = async () => {
                    if (isInitiator) {
                        try {
                            const offer = await pc.createOffer();
                            await pc.setLocalDescription(offer);
                            socket.emit('webrtcSignal', { target: targetId, signal: { type: 'offer', offer: pc.localDescription } });
                        } catch (err) { console.error(err); }
                    }
                };
                return pc;
            }

            // Menangani acara WebRTC dari Server
            socket.on('userJoined', (user) => { if (currentChannel) createPeerConnection(user.id, true); }); 
            
            socket.on('userLeft', (userId) => {
                if (!currentChannel) return;
                if (peers[userId]) { peers[userId].close(); delete peers[userId]; }
                const wrapper = document.getElementById(`wrapper-${userId}`);
                if (wrapper) wrapper.remove();
                updateVideoGridVisibility();
            });

            socket.on('webrtcSignal', async (data) => {
                if (!currentChannel) return; // Jangan proses sinyal jika sedang offline
                const { sender, signal } = data;
                let pc = peers[sender];
                try {
                    if (signal.type === 'offer') {
                        if (!pc) pc = createPeerConnection(sender, false);
                        await pc.setRemoteDescription(new RTCSessionDescription(signal.offer));
                        
                        // Eksekusi antrean koordinat (ICE) yang sempat tertunda
                        if (pc.iceQueue) {
                            pc.iceQueue.forEach(c => pc.addIceCandidate(new RTCIceCandidate(c)).catch(e => {}));
                            pc.iceQueue = [];
                        }

                        // Memasukkan track lokal kita ke Transceiver yang baru saja dibuat oleh Server dari Offer
                        if (localStream) {
                            const transceivers = pc.getTransceivers();
                            const audioTrack = localStream.getAudioTracks()[0];
                            if (audioTrack) {
                                const t = transceivers.find(t => (t.receiver && t.receiver.track && t.receiver.track.kind === 'audio') || (t.sender && t.sender.track && t.sender.track.kind === 'audio'));
                                if (t && t.sender) t.sender.replaceTrack(audioTrack);
                            }
                            const videoTrack = localStream.getVideoTracks()[0];
                            if (videoTrack) {
                                const t = transceivers.find(t => (t.receiver && t.receiver.track && t.receiver.track.kind === 'video') || (t.sender && t.sender.track && t.sender.track.kind === 'video'));
                                if (t && t.sender) t.sender.replaceTrack(videoTrack);
                            }
                        }
                        
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        socket.emit('webrtcSignal', { target: sender, signal: { type: 'answer', answer: pc.localDescription } });
                    } else if (signal.type === 'answer') {
                        if (pc) {
                            await pc.setRemoteDescription(new RTCSessionDescription(signal.answer));
                            if (pc.iceQueue) {
                                pc.iceQueue.forEach(c => pc.addIceCandidate(new RTCIceCandidate(c)).catch(e => {}));
                                pc.iceQueue = [];
                            }
                        }
                    } else if (signal.type === 'candidate') {
                        if (pc) {
                            if (pc.remoteDescription && pc.remoteDescription.type) {
                                await pc.addIceCandidate(new RTCIceCandidate(signal.candidate));
                            } else {
                                // Jika setRemoteDescription belum selesai, masukkan ke antrean!
                                if (!pc.iceQueue) pc.iceQueue = [];
                                pc.iceQueue.push(signal.candidate);
                            }
                        }
                    }
                } catch (err) { console.error("WebRTC Error:", err); }
            });
        }
    </script>
